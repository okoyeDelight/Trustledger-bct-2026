name: Browser evaluator — end-to-end demo
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'service-worker.js'
      - 'e2e/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/browser-evaluator.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node test dependencies
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run click-through checks (desktop + mobile)
        run: npx playwright test
      - name: Preserve screenshots and failure traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustledger-browser-evaluation
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
