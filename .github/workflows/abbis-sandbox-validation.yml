name: ABBIS source sandbox validation
on:
  pull_request:
    paths:
      - "abbis-sandbox/**"
      - ".github/workflows/abbis-sandbox-validation.yml"
  push:
    branches: [feat/submission-proof-lab-1111]
    paths:
      - "abbis-sandbox/**"
      - ".github/workflows/abbis-sandbox-validation.yml"
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abbis-sandbox
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install exact source app dependencies
        run: npm install --no-audit --no-fund
      - name: Validate types
        run: npm run typecheck
      - name: Build independent source app
        run: npm run build
