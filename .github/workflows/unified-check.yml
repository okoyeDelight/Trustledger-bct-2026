name: Consolidated TrustLedger validation
on:
  push:
    branches: [integration/unified-product]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Python syntax
        run: python -m compileall -q backend/app
      - name: Run data pipeline and workflow tests
        run: python -m pytest -q backend/tests
      - name: Ensure no synthetic CSV or credentials were copied into code branch
        run: |
          test ! -f backend/data/raw/temperature_logs.csv
          test ! -f backend/.env
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Type-check frontend
        run: npm --prefix frontend run typecheck
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Build Next.js application
        run: npm --prefix frontend run build
