name: Consolidated TrustLedger validation
on:
  push:
    branches: [integration/unified-product]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt pytest "httpx>=0.27,<1"
      - name: Python syntax
        run: python -m compileall -q backend/app
      - name: Run data pipeline and workflow tests
        run: python -m pytest -q backend/tests
      - name: Ensure secrets and raw CSV were not committed
        run: |
          test ! -f backend/data/raw/temperature_logs.csv
          test ! -f backend/.env
      - name: Verify pinned source data and complete processing pipeline
        run: |
          python backend/tools/fetch_synthetic_inputs.py
          cd backend
          python -m app.run_pipeline --data data/raw --output data/processed
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('data/processed')
          summary=json.loads((out/'pipeline_summary.json').read_text())
          assert summary['incident_count'] > 0
          assert (out/'incidents.csv').exists()
          assert (out/'temperature_gaps_by_facility.csv').exists()
          print('Verified source-backed incidents:', summary['incident_count'])
          PY
      - name: Prove sandbox replay uses real pinned source rows
        run: |
          cd backend
          python - <<'PY'
          from app.main import sandbox_source_series, DemoUser
          from datetime import datetime, timedelta
          user=DemoUser(username='source-ci',actor_name='Synthetic CI Actor',role='facility_staff')
          result=sandbox_source_series(user=user)
          rows=result['items']
          assert len(rows)==4
          assert all(float(r['temperature_c'])>6 for r in rows)
          dates=[datetime.fromisoformat(r['observed_at']) for r in rows]
          assert all(b-a==timedelta(hours=1) for a,b in zip(dates,dates[1:]))
          assert result['timestamp_note']
          print('Pinned source replay verified:',result['source_incident_id'])
          import json
          print('SANDBOX_SOURCE_FIXTURE='+json.dumps({'items':result['items'],'source_incident_id':result['source_incident_id'],'source_revision':result['source_revision'],'timestamp_note':result['timestamp_note']},separators=(',',':')))
          PY
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Type-check frontend
        run: npm --prefix frontend run typecheck
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Verify consolidated Vercel JSON configuration
        run: |
          python -m json.tool vercel.json > /dev/null
          python - <<'PY'
          import json
          config=json.load(open("vercel.json"))
          assert "frontend" in config["services"] and "backend" in config["services"]
          assert config["rewrites"][-1]["source"]=="/(.*)", "homepage must route to frontend"
          assert config["rewrites"][-1]["destination"]=={"service":"frontend"}
          assert any(route["source"]=="/api/(.*)" and route["destination"]=={"service":"backend"} for route in config["rewrites"])
          print("Vercel root and API service routes verified")
          PY
      - name: Build Next.js application
        run: npm --prefix frontend run build

  abbis-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ABBIS source sandbox
        run: npm --prefix abbis-sandbox install --no-audit --no-fund
      - name: Verify independent sandbox API contracts
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const source=JSON.parse(fs.readFileSync('abbis-sandbox/data/source.json','utf8'));
          if(source.items.length!==4)throw Error('Source fixture must have four chronological readings');
          if(source.items.some(x=>x.source_system!=='ABBIS-SANDBOX'||x.facility_id!=='HSP-028'||x.temperature_c<=6))throw Error('Incorrect source/facility/value');
          const stamps=source.items.map(x=>Date.parse(x.observed_at));
          if(stamps.some((t,i)=>i>0&&t-stamps[i-1]!==3600000))throw Error('Source observations are not consecutive');
          const routes=['connect','connection','disconnect','replay','cases','cases/[id]'];
          for(const route of routes)if(!fs.existsSync('abbis-sandbox/app/api/'+route+'/route.ts'))throw Error('Missing real HTTP bridge route: '+route);
          const integration=fs.readFileSync('abbis-sandbox/lib/integration.ts','utf8');
          if(!integration.includes('aes-256-gcm')||!integration.includes('httpOnly:true'))throw Error('Session credentials not safeguarded');
          console.log('Verified 4 pinned observations, 6 relay routes and protected session storage');
          JS
      - name: Type-check ABBIS source sandbox
        run: npm --prefix abbis-sandbox run typecheck
      - name: Build ABBIS source sandbox
        run: npm --prefix abbis-sandbox run build
