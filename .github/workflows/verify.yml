name: Verify TrustLedger prototype
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/engine.js
          node --check src/app.js
          node --check service-worker.js
      - name: Check step-two server and access rules syntax
        run: |
          node --check src/access-policy.mjs
          node --check api/me.js
      - name: Test evidence and simulated decision workflow
        run: npm test
      - name: Test traceable data cleansing without starter ZIP
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Stage audited judge source snapshot (private artifact; no auto-publish)
        run: |
          python3 scripts/build_judge_bundle.py --out _judge_package
          test -f _judge_package/README.md
          test -f _judge_package/RELEASE_MANIFEST.json
          test ! -f _judge_package/HANDOFF.md
          test ! -f _judge_package/docs/KICKOFF_AUDIO_REQUIREMENTS_AND_DECISIONS_2026-11-10.md
      - name: Upload judge package for release review
        uses: actions/upload-artifact@v4
        with:
          name: trustledger-judge-package
          path: _judge_package/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
